name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to package
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    name: Build GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Validate requested tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Expected an existing vX.Y.Z tag\n' >&2
            exit 1
          fi
          printf 'value=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.6"
      - run: sfw pnpm install --frozen-lockfile
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: node scripts/release-check.mjs "$RELEASE_TAG"
      - run: pnpm verify:static
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Package exact tagged assets, SBOM and checksums
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: pnpm release:package "$RELEASE_TAG"
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --generate-notes --title "Posthop $RELEASE_TAG"
